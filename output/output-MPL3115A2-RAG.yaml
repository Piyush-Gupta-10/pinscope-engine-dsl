component: ADXL345
category: Sensor

packages:
  lga16:
    pins:
      power.vdd.main: ["1"]
      power.gnd.ref: ["2"]
      signal.spi.sdo: ["3"]
      signal.spi.sdi: ["4"]
      signal.spi.sck: ["5"]
      signal.spi.ncs: ["6"]
      signal.int1.out: ["7"]
      signal.int2.out: ["8"]
      analog.cap.ref: ["9"]
      power.vddio.main: ["10"]
      signal.i2c.sda: ["11"]
      signal.i2c.scl: ["12"]
      config.altaddr.strap: ["13"]
      config.sleep.strap: ["14"]
      config.lowpower.strap: ["15"]
      power.gnd.ref: ["16"]

pins:
  power.vdd.main:
    names: ["VDD"]
    role: power
    direction: input
    voltage:
      nominal: 3.3
      abs_min: 1.95
      abs_max: 3.6
    rules:
      - cap(0.1u)!
    description: Main power supply

  power.gnd.ref:
    names: ["GND"]
    role: ground
    direction: passive
    description: Ground reference

  power.vddio.main:
    names: ["VDDIO"]
    role: power
    direction: input
    voltage:
      nominal: 3.3
      abs_min: 1.95
      abs_max: 3.6
    rules:
      - cap(0.1u)!
    description: I/O power supply

  signal.spi.sdo:
    names: ["SDO"]
    role: io
    direction: input
    tags: [spi_miso]
    description: SPI Data Out (Master In Slave Out)

  signal.spi.sdi:
    names: ["SDI"]
    role: io
    direction: output
    tags: [spi_mosi]
    description: SPI Data In (Master Out Slave In)

  signal.spi.sck:
    names: ["SCK"]
    role: clock
    direction: input
    tags: [spi_sclk]
    description: SPI Clock

  signal.spi.ncs:
    names: ["NCS"]
    role: io
    direction: input
    tags: [spi_cs]
    description: SPI Chip Select (active low)

  signal.int1.out:
    names: ["INT1"]
    role: io
    direction: output
    description: Interrupt 1 output

  signal.int2.out:
    names: ["INT2"]
    role: io
    direction: output
    description: Interrupt 2 output

  analog.cap.ref:
    names: ["CAP"]
    role: analog
    direction: passive
    rules:
      - cap(1u)!
    description: Decoupling capacitor

  signal.i2c.sda:
    names: ["SDA"]
    role: io
    direction: bidirectional
    rules:
      - pull(up, power.vddio.main, <=10k)!
    tags: [i2c_sda]
    description: I2C data line

  signal.i2c.scl:
    names: ["SCL"]
    role: clock
    direction: input
    tags: [i2c_scl]
    description: I2C clock line

  config.altaddr.strap:
    names: ["ALT ADDRESS"]
    role: config
    direction: input
    description: Alternate I2C address strap pin

  config.sleep.strap:
    names: ["SLEEP"]
    role: config
    direction: input
    description: Sleep mode strap pin

  config.lowpower.strap:
    names: ["LOWPOWER"]
    role: config
    direction: input
    description: Low power mode strap pin