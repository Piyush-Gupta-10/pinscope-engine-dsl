component: MPL3115A2
category: Sensor

packages:
  lga8:
    pins:
      power.vdd.main: ["1"]
      analog.cap.ref: ["2"]
      power.gnd.ref: ["3"]
      power.vddio.main: ["4"]
      signal.int2.out: ["5"]
      signal.int1.out: ["6"]
      signal.i2c.sda: ["7"]
      signal.i2c.scl: ["8"]

pins:
  power.vdd.main:
    names: ["VDD"]
    role: power
    direction: input
    voltage:
      nominal: 2.5
      abs_min: 1.95
      abs_max: 3.6
    rules:
      - cap(0.1u)!
    description: VDD power supply connection (1.95 V to 3.6 V)

  analog.cap.ref:
    names: ["CAP"]
    role: analog
    direction: passive
    description: External capacitor

  power.gnd.ref:
    names: ["GND"]
    role: ground
    direction: input
    description: Ground

  power.vddio.main:
    names: ["VDDIO"]
    role: power
    direction: input
    voltage:
      nominal: 1.8
      abs_min: 1.62
      abs_max: 3.6
    description: Digital interface power supply (1.62 V to 3.6 V)

  signal.int2.out:
    names: ["INT2"]
    role: io
    direction: output
    description: Pressure interrupt 2

  signal.int1.out:
    names: ["INT1"]
    role: io
    direction: output
    description: Pressure interrupt 1

  signal.i2c.sda:
    names: ["SDL", "SDA"]
    role: io
    direction: bidirectional
    description: I2C serial data
    tags: [i2c_sda]

  signal.i2c.scl:
    names: ["SCL"]
    role: clock
    direction: output
    description: I2C serial clock