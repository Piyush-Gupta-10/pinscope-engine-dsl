component: LMV324
category: Amplifier

packages:
  soic8:
    pins:
      power.vcc.main: ["1"]
      signal.in1.p: ["2"]
      signal.out1: ["3"]
      power.gnd.ref: ["4"]
      signal.in2.p: ["5"]
      signal.out2: ["6"]
      signal.in3.p: ["7"]
      signal.out3: ["8"]

pins:
  power.vcc.main:
    names: ["VCC"]
    role: power
    direction: input
    voltage:
      nominal: 5.0
      abs_min: 2.7
      abs_max: 5.5
    rules:
      - cap(0.1u)!
    description: Main power supply

  power.gnd.ref:
    names: ["GND"]
    role: ground
    direction: input
    description: Ground reference

  signal.in1.p:
    names: ["IN1"]
    role: io
    direction: input
    description: Input 1 positive

  signal.out1:
    names: ["OUT1"]
    role: io
    direction: output
    description: Output 1

  signal.in2.p:
    names: ["IN2"]
    role: io
    direction: input
    description: Input 2 positive

  signal.out2:
    names: ["OUT2"]
    role: io
    direction: output
    description: Output 2

  signal.in3.p:
    names: ["IN3"]
    role: io
    direction: input
    description: Input 3 positive

  signal.out3:
    names: ["OUT3"]
    role: io
    direction: output
    description: Output 3