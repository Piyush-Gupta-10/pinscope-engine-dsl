component: TPS63020
category: Power

packages:
  VSON (14):
    pins:
      power.vina.in: ["1"]
      ground.logic.ref: ["2"]
      signal.fb.in: ["3"]
      power.vout.out: ["4", "5"]
      signal.l2.io: ["6", "7"]
      signal.l1.io: ["8", "9"]
      power.vin.in: ["10", "11"]
      signal.en.in: ["12"]
      signal.ps_sync.in: ["13"]
      signal.pg.out: ["14"]
      ground.power.ref: ["Exposed Thermal Pad"]

pins:
  power.vina.in:
    names: ["VINA"]
    role: power
    direction: input
    voltage:
      nominal: 3.6 #Example from Quiescent current test condition
      abs_min: 1.8
      abs_max: 5.5
    description: Supply voltage for control stage

  ground.logic.ref:
    names: ["GND"]
    role: ground
    direction: passive
    description: Control / logic ground

  signal.fb.in:
    names: ["FB"]
    role: io
    direction: input
    description: Voltage feedback of adjustable versions, must be connected to VOUT on fixed output voltage versions

  power.vout.out:
    names: ["VOUT"]
    role: power
    direction: output
    voltage:
      nominal: 3.3 #Example from Quiescent current test condition
      abs_min: 1.2
      abs_max: 5.5
    description: Buck-boost converter output

  signal.l2.io:
    names: ["L2"]
    role: io
    direction: bidirectional
    description: Connection for inductor

  signal.l1.io:
    names: ["L1"]
    role: io
    direction: bidirectional
    description: Connection for inductor

  power.vin.in:
    names: ["VIN"]
    role: power
    direction: input
    voltage:
      nominal: 3.6 #Example from Quiescent current test condition
      abs_min: 1.8
      abs_max: 5.5
    description: Supply voltage for power stage

  signal.en.in:
    names: ["EN"]
    role: io
    direction: input
    description: Enable input (1 enabled, 0 disabled), must not be left open

  signal.ps_sync.in:
    names: ["PS/SYNC"]
    role: io
    direction: input
    description: Enable / disable power save mode (1 disabled, 0 enabled, clock signal for synchronization), must not be left open

  signal.pg.out:
    names: ["PG"]
    role: io
    direction: output
    description: Output power good (1 good, 0 failure; open-drain), can be left open

  ground.power.ref:
    names: ["PGND", "Exposed Thermal Pad"]
    role: ground
    direction: passive
    description: Power ground